name: CI

on:
  push:
    branches: [dev, qa, uat, main, 'feature/**', 'fix/**']
  pull_request:
    branches: [dev, qa, uat, main]
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    name: Build, test and analyse
    runs-on: ubuntu-latest

    env:
      # Exposed at job level so the Sonar step can read it in its `if`
      # (the `secrets` context is not allowed inside step conditions).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts blocks lifecycle scripts from third-party packages,
      # which is the recommended posture for CI (supply-chain hardening).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Project scripts instead of npx: nothing is fetched on demand.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/

      # Skipped automatically until SONAR_TOKEN is configured in the repo secrets.
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
